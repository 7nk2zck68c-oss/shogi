<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>将棋・武将キャラクターAI版</title>
  <meta name="description" content="GitHub Pagesだけで高速に動く武将キャラクター将棋AI対戦です。">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="perspective.css">
  <link rel="stylesheet" href="mobile-3d.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">SAMURAI CHARACTER SHOGI</p><h1>将棋・武将キャラクターAI版</h1></div>
      <div class="controls"><button id="new-game">最初から</button><button id="undo" class="secondary">待った</button></div>
    </header>
    <section class="difficulty" aria-label="AIの強さ">
      <span>AIの強さ</span>
      <div id="difficulty-buttons" class="difficulty-buttons">
        <button data-level="beginner">初心者</button>
        <button data-level="intermediate">中級者</button>
        <button data-level="advanced">上級者</button>
        <button data-level="master">猛者</button>
      </div>
    </section>
    <section class="game-layout">
      <aside class="panel opponent"><h2>コンピューター</h2><div id="gote-hand" class="hand"></div><div id="thinking" class="thinking" aria-live="polite"></div></aside>
      <section class="board-stage" aria-label="3D将棋盤"><div class="board-wrap"><div class="files" aria-hidden="true"><span>９</span><span>８</span><span>７</span><span>６</span><span>５</span><span>４</span><span>３</span><span>２</span><span>１</span></div><div id="board" class="board" role="grid" aria-label="将棋盤"></div></div></section>
      <aside class="panel player"><h2>あなた（先手）</h2><div id="sente-hand" class="hand"></div><p id="status" class="status" aria-live="polite">あなたの手番です</p><div class="legend"><span><i class="dot legal"></i>移動可能</span><span><i class="dot last"></i>直前の手</span></div></aside>
    </section>
    <footer>外部API・Scratch・TurboWarpは使用しません。すべての処理をこのページ内で実行します。</footer>
  </main>
  <dialog id="promotion"><form method="dialog"><h2>成りますか？</h2><p>この駒は成ることができます。</p><div><button value="promote">成る</button><button value="keep" class="secondary">成らない</button></div></form></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
