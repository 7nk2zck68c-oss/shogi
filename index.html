<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scratchで作られたコンピューター対戦将棋">
  <title>将棋 — コンピューター対戦</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #241b13;
      --paper: #f7efd9;
      --paper-deep: #e8d3a4;
      --accent: #8b2e24;
      --wood: #bd7b36;
      --shadow: rgba(43, 27, 13, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.78), transparent 28rem),
        repeating-linear-gradient(88deg, rgba(92,52,18,.025) 0 1px, transparent 1px 8px),
        var(--paper);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font: 700 .76rem/1.2 system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.2rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: .08em;
    }

    .seal {
      display: grid;
      width: 58px;
      aspect-ratio: 1;
      place-items: center;
      flex: 0 0 auto;
      color: #fff8e8;
      background: var(--accent);
      border-radius: 4px;
      box-shadow: 0 6px 16px var(--shadow);
      font-size: 1.35rem;
      line-height: 1;
    }

    .player-shell {
      padding: clamp(10px, 2.4vw, 22px);
      overflow: hidden;
      background: linear-gradient(135deg, #d89a55, var(--wood));
      border: 1px solid rgba(78,43,14,.45);
      border-radius: 14px;
      box-shadow: 0 22px 60px var(--shadow), inset 0 1px rgba(255,255,255,.42);
    }

    .player-frame {
      position: relative;
      width: min(100%, 722px);
      aspect-ratio: 482 / 412;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(55,34,17,.42);
      border-radius: 7px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .local-notice {
      display: none;
      height: 100%;
      padding: 32px;
      place-content: center;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .local-notice strong { display: block; margin-bottom: 8px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .button {
      display: inline-flex;
      min-height: 44px;
      padding: 0 17px;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: rgba(255,255,255,.52);
      border: 1px solid rgba(65,40,17,.26);
      border-radius: 999px;
      font: 650 .9rem/1 system-ui, sans-serif;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.9);
    }

    .button.primary {
      color: #fff9ed;
      background: var(--accent);
      border-color: var(--accent);
    }

    .note {
      margin: 22px 2px 0;
      color: #594738;
      font: .85rem/1.7 system-ui, sans-serif;
    }

    @media (max-width: 540px) {
      main { width: min(100% - 20px, 960px); padding-top: 24px; }
      header { align-items: center; }
      .seal { width: 48px; font-size: 1.1rem; }
      .player-shell { padding: 7px; border-radius: 10px; }
      .actions { display: grid; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Scratch / vs computer</p>
        <h1>将棋</h1>
      </div>
      <div class="seal" aria-hidden="true">王将</div>
    </header>

    <section class="player-shell" aria-label="将棋ゲーム">
      <div class="player-frame">
        <iframe id="player" title="Scratch 将棋プレイヤー" allowfullscreen></iframe>
        <div id="local-notice" class="local-notice">
          <div>
            <strong>GitHub Pagesで公開すると、ここにゲームが表示されます。</strong>
            ローカルで遊ぶ場合は、下の「Scratchファイルを保存」からファイルを開いてください。
          </div>
        </div>
      </div>
    </section>

    <nav class="actions" aria-label="プロジェクト操作">
      <a class="button primary" id="open-player" href="#" target="_blank" rel="noopener">TurboWarpで開く</a>
      <a class="button" href="project.sb3" download>Scratchファイルを保存</a>
      <a class="button" href="scratch-src/project.json">ソースJSONを見る</a>
    </nav>

    <p class="note">あなたは先手、コンピューターは後手です。先手が指すと、少し待ってからコンピューターが自動で指します。再生にはインターネット接続が必要です。</p>
  </main>

  <script>
    const projectUrl = new URL("project.sb3", window.location.href);
    const openUrl = new URL("https://turbowarp.org/");
    openUrl.searchParams.set("project_url", projectUrl.href);
    document.querySelector("#open-player").href = openUrl.href;

    if (window.location.protocol === "http:" || window.location.protocol === "https:") {
      const embedUrl = new URL("https://turbowarp.org/embed");
      embedUrl.searchParams.set("project_url", projectUrl.href);
      embedUrl.searchParams.set("settings-button", "");
      document.querySelector("#player").src = embedUrl.href;
    } else {
      document.querySelector("#player").remove();
      document.querySelector("#local-notice").style.display = "grid";
      document.querySelector("#open-player").style.display = "none";
    }
  </script>
</body>
</html>
